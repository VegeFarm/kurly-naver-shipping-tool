services:
  - type: web
    name: kurly-naver-shipping-tool
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: EXCEL_PASSWORD
        value: "0000"
      - key: OUTPUT_EXCEL_PASSWORD
        value: ""
      - key: DATABASE_URL
        sync: false

      # 컬리 호출은 Mac relay가 담당합니다. Render에는 컬리 clientId/secretKey를 저장하지 않습니다.
      - key: KURLY_RELAY_URL
        sync: false
      - key: KURLY_RELAY_SECRET
        sync: false
      - key: KURLY_RELAY_TIMEOUT_SECONDS
        value: "90"
      - key: KURLY_RELAY_BATCH_SIZE
        value: "300"

      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: NAVER_TOKEN_TYPE
        value: SELF
      - key: NAVER_ACCOUNT_ID
        sync: false
      - key: NAVER_BASE_URL
        value: https://api.commerce.naver.com/external
